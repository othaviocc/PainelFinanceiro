<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consultoria IA · Painel Financeiro</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <h1>Consultoria IA</h1>
  <p class="sub">Bots que leem notícias, cotações e indicadores e comentam o cenário. Análise educacional, não é recomendação.</p>

  <div class="grid cols-3" id="bots"><div class="state">Carregando…</div></div>

  <section class="card" style="margin-top:16px">
    <h2 id="form-title">Escolha um bot</h2>
    <form id="form" class="form-row" hidden>
      <label class="field" id="f-capital">Capital (R$) <input id="capital" type="number" min="1" step="any" value="10000"></label>
      <label class="field" id="f-perfil">Perfil
        <select id="perfil"><option value="conservador">Conservador</option><option value="moderado" selected>Moderado</option><option value="arrojado">Arrojado</option></select></label>
      <label class="field" id="f-horizonte">Horizonte
        <select id="horizonte"><option value="curto">Curto prazo</option><option value="medio" selected>Médio prazo</option><option value="longo">Longo prazo</option></select></label>
      <label class="field" style="flex:1;min-width:220px">Ativos (separados por vírgula)
        <input id="symbols" maxlength="120" placeholder="PETR4, VALE3, BTC-BRL, USD-BRL"></label>
      <label class="field" style="flex:1;min-width:220px">Pergunta (opcional)
        <input id="pergunta" maxlength="500" placeholder="ex.: o que esperar da semana?"></label>
      <button class="btn" id="go" type="submit">Analisar</button>
    </form>
  </section>

  <section class="card analysis" id="out" style="margin-top:16px" hidden></section>
</main>

<script src="/js/common.js"></script>
<script>
  renderLayout("ia.html");
  let bots = [], bot = null;

  async function init() {
    try {
      ({ bots } = await api("/ai/bots"));
      $("#bots").innerHTML = bots.map((b) => `
        <div class="card bot" data-id="${esc(b.id)}"><h3>${esc(b.nome)}</h3><p>${esc(b.descricao)}</p></div>`).join("");
    } catch (e) { $("#bots").innerHTML = errorBox(e.message); }
  }

  $("#bots").addEventListener("click", (ev) => {
    const el = ev.target.closest(".bot"); if (!el) return;
    bot = bots.find((b) => b.id === el.dataset.id);
    document.querySelectorAll(".bot").forEach((x) => x.classList.toggle("selected", x === el));
    $("#form-title").textContent = bot.nome;
    $("#form").hidden = false;
    $("#symbols").value = bot.ativos_padrao.join(", ");
    // Capital/perfil/horizonte só fazem sentido para o consultor de carteira
    ["f-capital", "f-perfil", "f-horizonte"].forEach((id) => { $("#" + id).hidden = bot.id !== "consultor"; });
  });

  $("#form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (!bot) return;
    const out = $("#out"), btn = $("#go");
    out.hidden = false; out.innerHTML = loading("O bot está analisando dados e notícias… (pode levar até 30 s)");
    btn.disabled = true;
    const body = {
      symbols: $("#symbols").value.split(",").map((s) => s.trim()).filter(Boolean),
      pergunta: $("#pergunta").value.trim(),
    };
    if (bot.id === "consultor") {
      body.capital = Number($("#capital").value); body.perfil = $("#perfil").value; body.horizonte = $("#horizonte").value;
    }
    try {
      render(await api("/ai/" + encodeURIComponent(bot.id), { method: "POST", body }));
    } catch (e) { out.innerHTML = errorBox(e.message); }
    finally { btn.disabled = false; }
  });

  const LEITURA = { alta: ["up", "▲ Alta"], baixa: ["down", "▼ Baixa"], neutra: ["", "● Neutra"] };

  /** Desenha a resposta estruturada do bot (resumo, sinais, alocação, riscos). */
  function render(r) {
    const a = r.analise;
    const list = (items) => `<ul class="clean">${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`;
    let html = `<div class="card-head"><h2>${esc(r.bot.nome)}</h2><small style="color:var(--muted)">${esc(new Date(r.gerado_em).toLocaleString("pt-BR"))}</small></div>
      <p>${esc(a.resumo)}</p>`;
    if (a.sinais.length) {
      html += "<h3>Sinais por ativo</h3>" + a.sinais.map((s) => {
        const [cls, label] = LEITURA[s.leitura] || ["", esc(s.leitura)];
        return `<div class="signal"><span class="badge ${cls}" style="min-width:84px;text-align:center">${label}</span>
          <div><b>${esc(s.ativo)}</b><br><span style="color:var(--muted)">${esc(s.motivo)}</span></div></div>`;
      }).join("");
    }
    if (a.alocacao.length) {
      html += "<h3>Divisão sugerida do capital</h3>" + a.alocacao.map((x) => `
        <div class="alloc"><div class="alloc-top"><span>${esc(x.ativo)}</span>
          <span>${fmtNum(x.percentual, 1)}%${x.valor != null ? " · " + fmtMoney(x.valor) : ""}</span></div>
          <div class="bar"><i style="width:${Math.min(100, Math.max(0, Number(x.percentual) || 0))}%"></i></div>
          <small>${esc(x.justificativa || "")}</small></div>`).join("");
    }
    if (a.riscos.length) html += "<h3>Riscos</h3>" + list(a.riscos);
    if (a.proximos_passos.length) html += "<h3>Próximos passos</h3>" + list(a.proximos_passos);
    html += `<div class="disclaimer">${esc(r.aviso)}</div>`;
    $("#out").innerHTML = html;
    $("#out").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  init();
</script>
</body>
</html>
